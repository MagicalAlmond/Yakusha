name: native

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-gnullvm
      - name: Download llvm-mingw
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-msvcrt-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath C:\Tools
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the native components
        run: node native/build.mjs --llvm-mingw C:\Tools\llvm-mingw-20261020-msvcrt-x86_64
      - name: Verify the staged native package
        shell: pwsh
        run: |
          node native/verify.mjs
          $manifest = npm pack --dry-run --json --ignore-scripts | ConvertFrom-Json
          $paths = @($manifest[0].files | ForEach-Object { $_.path })
          foreach ($required in @(
            "native/prebuilt/manifest.json",
            "native/prebuilt/yakusha_rgss_hook.dll",
            "native/prebuilt/libunwind.dll",
            "native/prebuilt/yakusha_injector.exe",
            "native/prebuilt/bootstrap.rb",
            "gui/main.js"
          )) {
            if ($paths -notcontains $required) { throw "npm package is missing $required" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: native-prebuilt
          path: native/prebuilt
